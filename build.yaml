---
include:
  - board: ergohaven
    shield: op36_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: ergohaven
    shield: op36_left
    keymap: op36_ruen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: op36_left_ruen-ergohaven-zmk
  - board: ergohaven
    shield: op36_right
  - board: ergohaven
    shield: op36_qube qube dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: op36_qube-ergohaven-zmk
  - board: ergohaven
    shield: op36_qube qube dongle_screen
    keymap: op36_ruen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: op36_qube_ruen-ergohaven-zmk
  - board: ergohaven
    shield: op36_left_qube
  # K:04 Mini (from fustopoke/ergohaven-zmk-config):
  # Central (left) half — ZMK Studio enabled over USB.
  - board: ergohaven
    shield: k04_mini_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Peripheral (right) half with the touchpad module.
  - board: ergohaven
    shield: k04_mini_right
  # Settings reset — flash once per half when migrating from RMK.
  - board: ergohaven
    shield: settings_reset
